name: Native engine real Android APK acceptance
on:
  push:
    paths:
      - '.github/workflows/native-apk.yml'
  workflow_dispatch:
    inputs:
      assets_run:
        description: 'Reuse native-android-apk-disk from a previous run (optional)'
        type: string
        required: false
permissions:
  contents: read
  actions: read
jobs:
  assets:
    if: ${{ inputs.assets_run == '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        with:
          path: android11.iso
          key: bliss14-foss-44e4144a3d31f823-v1
      - name: Build disposable derived image and signed code-free APK; no QEMU or guestfs
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full squashfs-tools e2fsprogs musl-tools aapt apksigner android-framework-res
          echo '44e4144a3d31f8233a5826b6a5079c4514589286a2f9b59bdf8d303d10e8f577  android11.iso' | sha256sum -c -
          7z x android11.iso kernel initrd.img system.sfs -oapk-source
          rm android11.iso
          python3 tests/native_android_assets.py apk-source
          compression=$(unsquashfs -s apk-source/system.sfs | awk '/^Compression/{print $2}')
          case "$compression" in gzip|lz4|xz|zstd|lzo) ;; *) echo 'Unsupported source compression'; exit 1;; esac
          unsquashfs -d apk-system apk-source/system.sfs
          rm apk-source/system.sfs
          musl-gcc -std=c11 -O2 -static -Wall -Wextra -Werror -DNEXUS_BRIDGE_COM2 guest-tools/nexus-guest/agent.c -o nexus-native-agent
          python3 tests/native_android_apk_prepare.py
          e2fsck -fn apk-system/system.img
          mkdir -p apk-tree/android/data native-apk-artifact
          mksquashfs apk-system apk-tree/android/system.sfs -noappend -comp "$compression" -processors 2
          rm -rf apk-system
          truncate -s 4G native-apk.raw
          mkfs.ext4 -F -b 4096 -L NEXUS_APK_CI -O ^64bit,^metadata_csum_seed,^orphan_file -d apk-tree native-apk.raw
          cargo build --release --locked --manifest-path rust/nexus-engine/Cargo.toml
          rust/nexus-engine/target/release/nexus-engine import-raw native-apk.raw native-apk-artifact/android-system.zlag
          rm native-apk.raw
          cat > AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="org.nexus.smoke" android:versionCode="1" android:versionName="1"><uses-sdk android:minSdkVersion="23" android:targetSdkVersion="30"/><application android:hasCode="false" android:label="Nexus native APK acceptance"/></manifest>
          EOF
          aapt package -f -M AndroidManifest.xml -I /usr/share/android-framework-res/framework-res.apk -F unsigned.apk
          keytool -genkeypair -keystore ci-apk.keystore -storepass android -keypass android -alias ci -keyalg RSA -keysize 2048 -validity 2 -dname 'CN=Nexus disposable CI test'
          apksigner sign --ks ci-apk.keystore --ks-pass pass:android --key-pass pass:android --out native-apk-artifact/smoke.apk unsigned.apk
          apksigner verify --verbose native-apk-artifact/smoke.apk
          rm ci-apk.keystore
          cp apk-source/kernel apk-source/initrd.img apk-source/manifest.json native-apk-derived-manifest.json native-apk-artifact/
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path('native-apk-artifact')
          def digest(path):
              h=hashlib.sha256()
              with path.open('rb') as f:
                  for b in iter(lambda:f.read(4194304),b''): h.update(b)
              return h.hexdigest()
          (root/'SHA256.json').write_text(json.dumps({p.name:{'bytes':p.stat().st_size,'sha256':digest(p)} for p in root.iterdir() if p.is_file()},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: native-android-apk-disk
          path: native-apk-artifact/
          retention-days: 3
  apk:
    needs: assets
    if: ${{ always() && (needs.assets.result == 'success' || inputs.assets_run != '') }}
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: native-android-apk-disk
          path: native-apk-artifact
          run-id: ${{ inputs.assets_run || github.run_id }}
          github-token: ${{ github.token }}
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Build independent Rust engine
        shell: python
        run: |
          import runpy
          runpy.run_path('tests/build_native_engine.py',run_name='__main__')
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nexus-engine-exe
          path: rust/nexus-engine/target/release/nexus-engine.exe
          if-no-files-found: error
          retention-days: 14
      - name: Require real Android install, package presence and uninstall over native COM2
        shell: python
        run: |
          import runpy
          runpy.run_path('tests/native_android_apk_checkpoint.py',run_name='__main__')
      - name: Physical Windows host evidence (OS identity + WHP + real vCPU)
        shell: python
        run: |
          import subprocess,sys,runpy,os
          engine=os.path.join('rust','nexus-engine','target','release','nexus-engine')
          proc=subprocess.run([engine,'physical-check'],capture_output=True,text=True,timeout=120)
          if proc.stdout.strip(): print(proc.stdout.strip())
          if proc.stderr.strip(): print(proc.stderr.strip())
          # `physical-check` exits nonzero when the WHP/vCPU gate fails (e.g. a nested-virt
          # CI VM). It always writes the evidence JSON first, so we still run the structural
          # verifier and let THAT decide pass/fail. The strict --require-win10 --require-whp
          # gate is applied on a physical Windows 10/11 host, not on this Windows Server runner.
          if not os.path.isfile('native-win10-physical.json'):
              sys.exit('physical-check did not write native-win10-physical.json')
          runpy.run_path('tests/native_win10_physical_check.py',run_name='__main__')
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-android-real-apk-evidence
          path: |
            native-apk-serial.log
            native-apk-serial.log.timing.json
            native-apk-checkpoint.json
            native-win10-physical.json
            native-apk-artifact/*manifest.json
            native-apk-artifact/SHA256.json
            native-engine-*.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-apk-gate-summary
          path: native-apk-gate-summary.json
          if-no-files-found: ignore
      - name: Persist native-apk diagnostics on failure
        if: failure()
        shell: python
        run: |
          import json,re,subprocess,os
          from pathlib import Path
          os.makedirs('.ci-diag',exist_ok=True)
          lines=[]
          try:
              summary=json.loads(Path('native-apk-gate-summary.json').read_text())
              lines.append('GATE_SUMMARY='+json.dumps(summary))
          except Exception as e:
              lines.append('GATE_SUMMARY_UNAVAILABLE='+str(e))
          try:
              serial=Path('native-apk-serial.log').read_text(errors='replace')
              for marker in ['NEXUS_HOME_SELECTED','NEXUS_HOME_PROCESS_READY','NEXUS_HOME_PID_BEFORE','NEXUS_HOME_PID_AFTER','NEXUS_HOME_PROCESS_RETAINED','NEXUS_HOME_WINDOW_VISIBLE','NEXUS_HOME_FRAME_STATS_BEGIN','NEXUS_HOME_ACTIVITY_STATE_BEGIN','NEXUS_HOME_CRASH_LOG_BEGIN','NEXUS_ANR_BASELINE_BEGIN','NEXUS_ANR_AFTER_HOME_BEGIN','NATIVE_BRIDGE_EVENT HELLO','NATIVE_BRIDGE_EVENT NEXUS 1 READY 1','NATIVE_BRIDGE_APK_INSTALL_VERIFY_UNINSTALL_OK','NEXUS_ANDROID_REAL_APK_PRESENT','NEXUS_ANDROID_REAL_APK_UNINSTALLED']:
                  if marker in serial: lines.append('MARKER '+marker)
              anr=re.findall(r'(?m)^.*(?:ANR in|Not responding).*$',serial)
              lines.append('ANR_DEFINITIVE_LINES='+repr(anr[:20]) if anr else 'ANR_DEFINITIVE_LINES=none')
              for m in re.findall(r'(?m)^NEXUS_HOME_SELECTED (.+)$',serial): lines.append('HOME_SELECTED='+m)
              for m in re.findall(r'(?m)^(?:mResumedActivity|topResumedActivity|ResumedActivity):.*$',serial): lines.append('RESUMED='+m)
              for m in re.findall(r'(?m)^NEXUS_HOME_PID_(?:BEFORE|AFTER) (\d+)$',serial): lines.append('PID='+m)
          except Exception as e:
              lines.append('SERIAL_READ_FAILED='+str(e))
          Path('.ci-diag/native-apk-diag.txt').write_text('\n'.join(lines)+'\n')
          subprocess.run(['git','config','user.email','ci@nexus.local'])
          subprocess.run(['git','config','user.name','Nexus CI'])
          subprocess.run(['git','add','.ci-diag'])
          subprocess.run(['git','commit','-q','-m','ci-diag: native-apk failure diagnostics'])
          branch=os.environ.get('GITHUB_REF','refs/heads/main').split('/',2)[-1]
          subprocess.run(['git','fetch','-q','origin',branch])
          subprocess.run(['git','rebase','-q','origin/'+branch])
          subprocess.run(['git','push','-q','origin','HEAD:'+os.environ.get('GITHUB_REF','refs/heads/main')])
  home:
    needs: [assets, apk]
    if: ${{ always() && (needs.assets.result == 'success' || inputs.assets_run != '') }}
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: native-android-apk-disk
          path: native-apk-artifact
          run-id: ${{ inputs.assets_run || github.run_id }}
          github-token: ${{ github.token }}
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Build independent Rust engine
        shell: python
        run: |
          import runpy
          runpy.run_path('tests/build_native_engine.py',run_name='__main__')
      - name: Clean-launch usable-Home certification (no APK install)
        shell: python
        run: |
          import runpy
          runpy.run_path('tests/native_android_home_checkpoint.py',run_name='__main__')
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-android-home-evidence
          path: |
            native-home-serial.log
            native-home-serial.log.timing.json
            native-home-checkpoint.json
            native-home-software.ppm
            native-home-gate-summary.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-home-gate-summary
          path: native-home-gate-summary.json
          if-no-files-found: ignore
      - name: Persist native-home diagnostics on failure
        if: failure()
        shell: python
        run: |
          import json,re,subprocess,os
          from pathlib import Path
          os.makedirs('.ci-diag',exist_ok=True)
          lines=[]
          try:
              summary=json.loads(Path('native-home-gate-summary.json').read_text())
              lines.append('HOME_GATE_SUMMARY='+json.dumps(summary))
          except Exception as e:
              lines.append('HOME_GATE_SUMMARY_UNAVAILABLE='+str(e))
          try:
              serial=Path('native-home-serial.log').read_text(errors='replace')
              for marker in ['NEXUS_HOME_SELECTED','NEXUS_HOME_PROCESS_READY','NEXUS_HOME_PID_BEFORE','NEXUS_HOME_PID_AFTER','NEXUS_HOME_PROCESS_RETAINED','NEXUS_HOME_WINDOW_VISIBLE','NEXUS_HOME_FRAME_STATS_BEGIN','NEXUS_HOME_ACTIVITY_STATE_BEGIN','NEXUS_HOME_CRASH_LOG_BEGIN','NEXUS_HOME_ANR_BEGIN','NATIVE_BRIDGE_EVENT HELLO','NATIVE_BRIDGE_EVENT NEXUS 1 READY 1','NATIVE_BRIDGE_HOME_VERIFIED']:
                  if marker in serial: lines.append('MARKER '+marker)
              anr=re.findall(r'(?m)^.*(?:ANR in|Not responding).*$',serial)
              lines.append('ANR_DEFINITIVE_LINES='+repr(anr[:20]) if anr else 'ANR_DEFINITIVE_LINES=none')
              for m in re.findall(r'(?m)^NEXUS_HOME_SELECTED (.+)$',serial): lines.append('HOME_SELECTED='+m)
              for m in re.findall(r'(?m)^(?:mResumedActivity|topResumedActivity|ResumedActivity):.*$',serial): lines.append('RESUMED='+m)
          except Exception as e:
              lines.append('SERIAL_READ_FAILED='+str(e))
          Path('.ci-diag/native-home-diag.txt').write_text('\n'.join(lines)+'\n')
          subprocess.run(['git','config','user.email','ci@nexus.local'])
          subprocess.run(['git','config','user.name','Nexus CI'])
          subprocess.run(['git','add','.ci-diag'])
          subprocess.run(['git','commit','-q','-m','ci-diag: native-home failure diagnostics'])
          branch=os.environ.get('GITHUB_REF','refs/heads/main').split('/',2)[-1]
          subprocess.run(['git','fetch','-q','origin',branch])
          subprocess.run(['git','rebase','-q','origin/'+branch])
          subprocess.run(['git','push','-q','origin','HEAD:'+os.environ.get('GITHUB_REF','refs/heads/main')])

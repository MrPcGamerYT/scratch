name: Inspect verified guest branding captures
on:
  push:
    paths:
      - .github/workflows/branding-captures.yml
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  captures:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      matrix:
        stage: [first-boot, second-boot]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: android11-candidate-evidence
          run-id: '45648355363'
          path: evidence
          github-token: ${{ github.token }}
      - name: Prepare actual final Home framebuffer for review
        env:
          STAGE: ${{ matrix.stage }}
        run: |
          python3 -m pip install Pillow
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          import io,base64,json,os,hashlib
          stage=os.environ['STAGE']
          paths=list(Path('evidence').rglob(stage+'/screen-final.ppm'))
          assert len(paths)==1,paths
          path=paths[0]
          image=Image.open(path).convert('RGB'); image.thumbnail((960,600))
          quality=70
          while True:
              stream=io.BytesIO(); image.save(stream,format='JPEG',quality=quality)
              if stream.tell()<60000: break
              if quality>40: quality-=10
              else: image.thumbnail((image.width*9//10,image.height*9//10))
          name=stage+'-'+path.stem
          encoded=base64.b64encode(stream.getvalue()).decode()
          Path('capture.json').write_text(json.dumps({'name':name,'encoded':encoded}))
          print('::notice title=INFO-'+name+'::'+json.dumps({'source':str(path),'width':image.width,'height':image.height,'bytes':stream.tell(),'sha256':hashlib.sha256(stream.getvalue()).hexdigest()}))
          Path('emit.py').write_text("import json,sys\nd=json.load(open('capture.json')); s=d['encoded']; start=int(sys.argv[1])*8\nfor part in range(start,min(start+8,(len(s)+2799)//2800)):\n print(f\"::notice title=IMG-{d['name']}-{part:03}::{s[part*2800:(part+1)*2800]}\")\n")
          PY
      - name: Capture data segment 1
        run: python3 emit.py 0
      - name: Capture data segment 2
        run: python3 emit.py 1
      - name: Capture data segment 3
        run: python3 emit.py 2
      - name: Capture data segment 4
        run: python3 emit.py 3

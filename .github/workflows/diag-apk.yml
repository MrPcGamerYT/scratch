name: Diagnostic APK checkpoint
on:
  push:
    branches:
      - arena/b4ea6e6d-scratch
    paths:
      - '.github/workflows/diag-apk.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  checkpoint:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: native-android-apk-disk
          path: native-apk-artifact
          run-id: 46002755980
          github-token: ${{ github.token }}
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Build independent Rust engine
        shell: python
        run: |
          import runpy
          runpy.run_path('tests/build_native_engine.py', run_name='__main__')
      - name: Run APK checkpoint
        shell: python
        run: |
          import runpy, sys
          try:
              runpy.run_path('tests/native_android_apk_checkpoint.py', run_name='__main__')
          except SystemExit as e:
              print(f'CHECKPOINT_EXIT={e.code}')
      - name: Commit checkpoint outputs to branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir -p .ci-diag
          cp native-apk-checkpoint.json .ci-diag/ 2>/dev/null || true
          cp native-apk-serial.log .ci-diag/ 2>/dev/null || true
          cp native-apk-serial.log.timing.json .ci-diag/ 2>/dev/null || true
          cp native-engine-*.log .ci-diag/ 2>/dev/null || true
          git config user.email "ci@nexus.local"
          git config user.name "Nexus CI diagnostic"
          git add .ci-diag/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "ci: diagnostic apk checkpoint outputs [skip ci]"
            git push
          fi

name: Build downloadable nexus-engine.exe
on:
  push:
    paths:
      - 'rust/nexus-engine/**'
      - '.github/workflows/engine-exe.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  exe:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Build, test, clippy and net-smoke the engine
        shell: python
        run: |
          import subprocess,sys,os
          # Full gate: tests, clippy -D warnings, release build (build_native_engine.py),
          # then the in-process net-smoke. This verifies Fix 9 without the flaky APK checkpoint.
          proc=subprocess.run([sys.executable,'tests/build_native_engine.py'],
                              capture_output=True,text=True)
          if proc.stdout: print(proc.stdout)
          if proc.stderr: print(proc.stderr)
          with open('.ci-diag-build.txt','w') as f:
              f.write('RETURN=%d\nSTDOUT:\n%s\nSTDERR:\n%s\n' % (proc.returncode, proc.stdout, proc.stderr))
          if proc.returncode:
              sys.exit(proc.returncode)
          # Run the in-process VirtIO-MMIO net device smoke.
          proc2=subprocess.run([os.path.join('rust','nexus-engine','target','release','nexus-engine'),'net-smoke'],
                               capture_output=True,text=True,timeout=60)
          if proc2.stdout.strip(): print(proc2.stdout.strip())
          if proc2.stderr.strip(): print(proc2.stderr.strip())
          with open('.ci-diag-build.txt','a') as f:
              f.write('\nNET-SMOKE RETURN=%d\nSTDOUT:\n%s\nSTDERR:\n%s\n' % (proc2.returncode, proc2.stdout, proc2.stderr))
          if proc2.returncode: sys.exit(proc2.returncode)
          # Run the live WHP MMIO net device smoke (enum dispatch, GPA routing, IRQ6, loopback round-trip).
          proc3=subprocess.run([os.path.join('rust','nexus-engine','target','release','nexus-engine'),'net-mmio-smoke'],
                               capture_output=True,text=True,timeout=60)
          if proc3.stdout.strip(): print(proc3.stdout.strip())
          if proc3.stderr.strip(): print(proc3.stderr.strip())
          with open('.ci-diag-build.txt','a') as f:
              f.write('\nNET-MMIO-SMOKE RETURN=%d\nSTDOUT:\n%s\nSTDERR:\n%s\n' % (proc3.returncode, proc3.stdout, proc3.stderr))
          if proc3.returncode: sys.exit(proc3.returncode)
          # Run the in-process VirtIO-MMIO audio device smoke.
          proc4=subprocess.run([os.path.join('rust','nexus-engine','target','release','nexus-engine'),'audio-smoke'],
                               capture_output=True,text=True,timeout=60)
          if proc4.stdout.strip(): print(proc4.stdout.strip())
          if proc4.stderr.strip(): print(proc4.stderr.strip())
          with open('.ci-diag-build.txt','a') as f:
              f.write('\nAUDIO-SMOKE RETURN=%d\nSTDOUT:\n%s\nSTDERR:\n%s\n' % (proc4.returncode, proc4.stdout, proc4.stderr))
          sys.exit(proc4.returncode)
      - name: Persist build diagnostics on failure
        if: failure()
        shell: bash
        run: |
          mkdir -p .ci-diag
          cp .ci-diag-build.txt .ci-diag/build-error.txt 2>/dev/null || true
          git config user.email "ci@nexus.local"
          git config user.name "Nexus CI"
          git add .ci-diag
          git commit -q -m "ci-diag: engine-exe build failure output" || true
          git push -q origin HEAD:${{ github.ref }} || true
      - name: Run physical-check on this Windows host (informational; strict gate is physical)
        shell: python
        run: |
          import subprocess,os,sys
          engine=os.path.join('rust','nexus-engine','target','release','nexus-engine')
          proc=subprocess.run([engine,'physical-check'],capture_output=True,text=True,timeout=120)
          if proc.stdout.strip(): print(proc.stdout.strip())
          if proc.stderr.strip(): print(proc.stderr.strip())
          # This Windows Server CI runner lacks nested virtualization, so the strict
          # --require-whp gate is expected to fail here. We only record the evidence.
          if not os.path.isfile('native-win10-physical.json'):
              sys.exit('physical-check did not write native-win10-physical.json')
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nexus-engine-exe
          path: rust/nexus-engine/target/release/nexus-engine.exe
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nexus-engine-physical-evidence
          path: native-win10-physical.json
          if-no-files-found: ignore
          retention-days: 14

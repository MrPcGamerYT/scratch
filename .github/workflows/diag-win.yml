name: Diagnostic Windows cargo build
on:
  push:
    branches:
      - arena/b4ea6e6d-scratch
    paths:
      - '.github/workflows/diag-win.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Run real build script (test + clippy + release)
        shell: python
        run: |
          import runpy, sys
          try:
              runpy.run_path('tests/build_native_engine.py', run_name='__main__')
          except SystemExit as e:
              print(f'BUILD_SCRIPT_EXIT={e.code}')
      - name: Commit build logs to branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir -p .ci-diag
          cp native-engine-*.log .ci-diag/ 2>/dev/null || true
          git config user.email "ci@nexus.local"
          git config user.name "Nexus CI diagnostic"
          git add .ci-diag/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "ci: diagnostic windows build logs [skip ci]"
            git push
          fi

name: Inspect verified initrd banner
on:
  push:
    paths: ['.github/workflows/inspect-boot-banner.yml']
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Nexus-Android11-FOSS-Candidate
          run-id: 45648355363
          github-token: ${{ github.token }}
          path: guest
      - run: |
          sudo apt-get update && sudo apt-get install -y qemu-utils
          qemu-img convert -f qcow2 -O raw guest/images/android-base.qcow2 guest.raw
          python3 - <<'PY'
          import struct,subprocess
          from pathlib import Path
          with open('guest.raw','rb') as f:
              f.seek(512); header=f.read(92)
              table=struct.unpack_from('<Q',header,72)[0]
              f.seek(table*512); entries=f.read(128*4)
              for i in range(4):
                  entry=entries[i*128:(i+1)*128]
                  first,last=struct.unpack_from('<QQ',entry,32)
                  if not first: continue
                  print(f'::notice::Partition {i+1}: {first}..{last}')
                  subprocess.run(['dd','if=guest.raw','of=partition.raw','bs=512',f'skip={first}',f'count={last-first+1}','conv=sparse','status=none'],check=True)
                  p=subprocess.run(['debugfs','-R','dump /android/initrd.img initrd.img','partition.raw'],capture_output=True,text=True)
                  if Path('initrd.img').exists():break
          assert Path('initrd.img').stat().st_size>1000
          PY
          python3 - <<'PY'
          import gzip,sys,base64
          from pathlib import Path
          sys.path.insert(0,'guest-tools')
          from install_bridge_ramdisk import records
          data=Path('initrd.img').read_bytes()
          from rebrand_boot import patch
          old=list(records(gzip.decompress(data) if data.startswith(b'\x1f\x8b') else data))
          updated=patch(data)
          new=list(records(gzip.decompress(updated) if updated.startswith(b'\x1f\x8b') else updated))
          assert len(old)==len(new)
          changed=[]
          for before,after in zip(old,new):
              assert before[:2][0]==after[:2][0]
              assert before[1][1:6]==after[1][1:6]
              if before[2]!=after[2]:
                  changed.append(before[0])
                  assert before[0].lstrip('./')=='init'
                  assert after[2].startswith(before[2].split(b'# ASCII art')[0])
                  assert b'Welcome to Nexus Android' in after[2]
          assert len(changed)==1,changed
          import hashlib
          print('::notice::PASS: actual verified initrd banner replaced; only init content changed; original copyright/licence prefix and record mode/ownership preserved. SHA256='+hashlib.sha256(updated).hexdigest())
          PY

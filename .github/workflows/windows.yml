name: Emulator CI
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  qemu-build:
    name: Build QEMU from source (Windows)
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: qemu/qemu
          ref: 698104725efad4b29079d857dfdebbd804e34c99
          path: qemu-source
      - uses: actions/checkout@v4
        with:
          repository: coreboot/seabios
          ref: b52ca86e094d19b58e2304417787e96b940e39c6
          path: seabios-source
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            base-devel git
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-glib2
            mingw-w64-x86_64-pixman
            mingw-w64-x86_64-SDL2
            mingw-w64-x86_64-libslirp
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-python
            mingw-w64-x86_64-python-packaging
            mingw-w64-x86_64-meson
            mingw-w64-x86_64-ninja
      - name: Compile and collect QEMU
        shell: msys2 {0}
        run: |
          set -o pipefail
          if ! bash packaging/build-qemu.sh 2>&1 | tee "$RUNNER_TEMP/qemu-build.log"; then
            tail -40 "$RUNNER_TEMP/qemu-build.log" | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: QEMU-source-build
          path: qemu-bundle/
          if-no-files-found: error
  windows:
    name: Windows Qt and launcher tests
    needs: qemu-build
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: win64_msvc2022_64
      - name: Configure
        run: cmake -S . -B build -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Download integrity tests
        run: ctest --test-dir build -C Release --output-on-failure
      - name: PowerShell syntax and launcher contract tests
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/scripts/launch.ps1", [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Error $_ }; exit 1 }
          $ErrorActionPreference = 'Continue'
          $output = & pwsh -NoProfile -File ./tests/launcher_tests.ps1 -Stub "$PWD/build/Release/qemu_stub.exe" 2>&1
          $code = $LASTEXITCODE
          $output | ForEach-Object { Write-Host $_ }
          if ($code -ne 0) {
            foreach ($line in $output) {
              $text = "$line".Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
              Write-Output "::error::$text"
            }
            exit $code
          }
      - uses: actions/download-artifact@v4
        with:
          name: QEMU-source-build
          path: package/qemu
      - name: Test bundled QEMU without MSYS2 installed
        shell: pwsh
        run: |
          $qemu = "$PWD/package/qemu/bin/qemu-system-x86_64.exe"
          $img = "$PWD/package/qemu/bin/qemu-img.exe"
          $accels = & $qemu -accel help 2>&1
          if ($LASTEXITCODE -ne 0 -or ($accels -join "`n") -notmatch 'whpx') { throw "Bundled QEMU missing WHPX: $accels" }
          $displays = & $qemu -display help 2>&1
          if ($LASTEXITCODE -ne 0 -or ($displays -join "`n") -notmatch 'sdl') { throw "Bundled QEMU missing SDL: $displays" }
          $env:QEMU_SYSTEM = $qemu
          $env:QEMU_IMG = $img
          python tests/qemu_smoke.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package shell
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path package -Force | Out-Null
          Copy-Item build/Release/ProjectNexus.exe package/
          windeployqt --release package/ProjectNexus.exe
          Copy-Item README.md package/
          Copy-Item scripts/launch.ps1 package/
      - uses: actions/upload-artifact@v4
        with:
          name: ProjectNexus-Windows
          path: package/
          if-no-files-found: error
  qemu-smoke:
    name: Real QEMU boot smoke test (Linux TCG)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install QEMU
        run: sudo apt-get update && sudo apt-get install -y qemu-system-x86 qemu-utils
      - name: Boot test sector and create QCOW2 disk
        run: python3 tests/qemu_smoke.py

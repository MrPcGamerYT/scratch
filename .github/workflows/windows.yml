name: Emulator CI
on:
  push:
    paths-ignore:
      - 'rust/nexus-engine/**'
      - 'tests/native_engine_cli_test.py'
      - 'tests/build_native_engine.py'
      - 'tests/whp_sdk_abi.cpp'
      - '.github/workflows/native-engine.yml'
      - '.github/workflows/native-kernel.yml'
      - 'tests/native_kernel_checkpoint.py'
      - 'docs/native-kernel-loader.md'
      - 'docs/native-engine-roadmap.md'
      - 'docs/zlag-image-format.md'
  pull_request:
  workflow_dispatch:
    inputs:
      qemu_run_id:
        description: 'Reuse QEMU-source-build artifact from this run ID (optional)'
        required: false
        type: string

      engine_benchmark:
        description: 'Compare reused candidate engine with the previous baseline'
        required: false
        type: boolean
        default: false

jobs:
  qemu-build:
    if: ${{ inputs.qemu_run_id == '' }}
    name: Build QEMU from source (Windows)
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: qemu/qemu
          ref: 698104725efad4b29079d857dfdebbd804e34c99
          path: qemu-source
      - uses: actions/checkout@v4
        with:
          repository: coreboot/seabios
          ref: b52ca86e094d19b58e2304417787e96b940e39c6
          path: seabios-source
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
      - name: Install QEMU build dependencies
        shell: msys2 {0}
        run: |
          set -o pipefail
          if ! pacman --noconfirm --needed -S base-devel git \
            mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-glib2 mingw-w64-ucrt-x86_64-pixman \
            mingw-w64-ucrt-x86_64-SDL2 mingw-w64-ucrt-x86_64-virglrenderer mingw-w64-ucrt-x86_64-libepoxy mingw-w64-ucrt-x86_64-libslirp mingw-w64-ucrt-x86_64-pkgconf \
            mingw-w64-ucrt-x86_64-python mingw-w64-ucrt-x86_64-python-pip mingw-w64-ucrt-x86_64-python-packaging \
            mingw-w64-ucrt-x86_64-meson mingw-w64-ucrt-x86_64-ninja 2>&1 | tee "$RUNNER_TEMP/deps.log"; then
            tail -30 "$RUNNER_TEMP/deps.log" | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          fi
      - name: Compile and collect QEMU
        shell: msys2 {0}
        run: |
          set -o pipefail
          if ! python -m pip install --break-system-packages pycotap==1.3.1 2>&1 | tee "$RUNNER_TEMP/pydeps.log"; then
            tail -20 "$RUNNER_TEMP/pydeps.log" | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          fi
          if ! bash packaging/build-qemu.sh 2>&1 | tee "$RUNNER_TEMP/qemu-build.log"; then
            grep -iE 'error:|FAILED:|ninja:|fatal|undefined reference|No such file|cannot' "$RUNNER_TEMP/qemu-build.log" | tail -8 | while IFS= read -r line; do echo "::error::$line"; done
            tail -1 "$RUNNER_TEMP/qemu-build.log" | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: QEMU-source-build
          path: qemu-bundle/
          if-no-files-found: error
  windows:
    name: Windows Qt and launcher tests
    needs: qemu-build
    if: ${{ always() && (needs.qemu-build.result == 'success' || (needs.qemu-build.result == 'skipped' && inputs.qemu_run_id != '')) }}
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: OTA payload extraction tests
        run: python tests/payload_tests.py
      - name: Rust core unit tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $output = & cargo test --locked --manifest-path rust/nexus-core/Cargo.toml 2>&1
          $code = $LASTEXITCODE
          $output | ForEach-Object { Write-Host $_ }
          if ($code -ne 0) {
            $output | Where-Object { "$_" -match 'error|fail|panic|thread' } | Select-Object -First 20 | ForEach-Object {
              $text = "$_".Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
              Write-Output "::error::$text"
            }
            exit $code
          }
      - name: Rust launch policy microbenchmark (not game FPS)
        run: cargo run --locked --release --manifest-path rust/nexus-core/Cargo.toml --bin runtime-bench
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: win64_msvc2022_64
      - name: Configure
        run: cmake -S . -B build -DBUILD_TESTING=ON
      - name: Build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $output = & cmake --build build --config Release --parallel 2>&1
          $code = $LASTEXITCODE
          $output | ForEach-Object { Write-Host $_ }
          if ($code -ne 0) {
            $output | Where-Object { "$_" -match 'error|fatal' } | Select-Object -First 15 | ForEach-Object {
              $text = "$_".Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
              Write-Output "::error::$text"
            }
            exit $code
          }
      - name: Native unit and integration tests
        shell: pwsh
        run: |
          # Managed-disk integration runs below, after the real QEMU artifact is installed.
          $output = & ctest --test-dir build -C Release --output-on-failure -E '^managed_disk_tests$' 2>&1
          $code = $LASTEXITCODE
          $output | ForEach-Object { Write-Output $_ }
          if ($code -ne 0) {
            $text = ($output | Out-String).Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error::$text"
            exit $code
          }
      - name: PowerShell syntax and launcher contract tests
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/scripts/launch.ps1", [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Error $_ }; exit 1 }
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/scripts/prepare-android.ps1", [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Error $_ }; exit 1 }
          $ErrorActionPreference = 'Continue'
          $output = & pwsh -NoProfile -File ./tests/launcher_tests.ps1 -Stub "$PWD/build/Release/qemu_stub.exe" 2>&1
          $code = $LASTEXITCODE
          $output | ForEach-Object { Write-Host $_ }
          if ($code -ne 0) {
            foreach ($line in $output) {
              $text = "$line".Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
              Write-Output "::error::$text"
            }
            exit $code
          }
      - name: Image studio workflow contract tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $output = & pwsh -NoProfile -File ./tests/image_studio_tests.ps1 -Stub "$PWD/build/Release/qemu_stub.exe" 2>&1
          $code = $LASTEXITCODE
          $output | ForEach-Object { Write-Host $_ }
          if ($code -ne 0) {
            $text = ($output | Out-String).Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error::$text"
            exit $code
          }
      - name: Image Studio ISO-only workflow contracts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $output = & pwsh -NoProfile -File ./tests/archive_studio_tests.ps1 -Stub "$PWD/build/Release/qemu_stub.exe" 2>&1
          $code = $LASTEXITCODE
          $output | ForEach-Object { Write-Host $_ }
          if ($code -ne 0) {
            $text = ($output | Out-String).Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error::$text"
            exit $code
          }
      - uses: actions/download-artifact@v4
        with:
          name: QEMU-source-build
          path: package/qemu
          run-id: ${{ inputs.qemu_run_id || github.run_id }}
          github-token: ${{ github.token }}
      - name: Brand embedded engine including reused artifacts
        shell: pwsh
        run: |
          python packaging/brand_engine.py package/qemu
          if ($LASTEXITCODE -ne 0) { throw 'Engine branding failed.' }
          $engine = Get-Item package/qemu/bin/NexusEngine.exe
          if ($engine.VersionInfo.FileDescription -ne 'Nexus Engine') { throw 'Engine file description mismatch.' }
          if ($engine.VersionInfo.ProductName -ne 'Nexus Engine (QEMU-based)') { throw 'Engine product attribution mismatch.' }
          if (Test-Path package/qemu/bin/qemu-system-x86_64.exe) { throw 'Unbranded runtime executable remains.' }
      - uses: actions/checkout@v4
        with:
          repository: qemu/qemu
          ref: 698104725efad4b29079d857dfdebbd804e34c99
          path: uefi-firmware-source
      - name: Add required upstream PC ROMs, UEFI firmware and notices
        shell: pwsh
        run: |
          python -c "import bz2,pathlib; s=pathlib.Path('uefi-firmware-source/pc-bios'); d=pathlib.Path('package/qemu/share/qemu'); [(d / n).write_bytes(bz2.decompress((s / (n + '.bz2')).read_bytes())) for n in ('edk2-x86_64-code.fd','edk2-i386-vars.fd')]"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Cached QEMU artifacts from older builds did not include this ROM.
          Copy-Item uefi-firmware-source/pc-bios/kvmvapic.bin package/qemu/share/qemu/
          Copy-Item uefi-firmware-source/pc-bios/vgabios-virtio.bin package/qemu/share/qemu/
          Copy-Item uefi-firmware-source/pc-bios/edk2-licenses.txt package/qemu/licenses/
          Copy-Item packaging/THIRD-PARTY.md package/qemu/licenses/
      - name: Test bundled QEMU without MSYS2 installed
        shell: pwsh
        run: |
          try {
            $qemu = "$PWD/package/qemu/bin/NexusEngine.exe"
            $img = "$PWD/package/qemu/bin/qemu-img.exe"
            $accels = & $qemu -accel help 2>&1
            if ($LASTEXITCODE -ne 0 -or ($accels -join "`n") -notmatch 'whpx') { throw "Bundled QEMU missing WHPX, exit $LASTEXITCODE : $accels" }
            $displays = & $qemu -display help 2>&1
            if ($LASTEXITCODE -ne 0 -or ($displays -join "`n") -notmatch 'sdl') { throw "Bundled QEMU missing SDL, exit $LASTEXITCODE : $displays" }
            $audio = & $qemu -audiodev help 2>&1
            if ($LASTEXITCODE -ne 0 -or ($audio -join "`n") -notmatch 'dsound') { throw "Bundled QEMU missing DirectSound: $audio" }
            $devices = & $qemu -device help 2>&1
            if (($devices -join "`n") -notmatch 'virtio-vga') { throw "Bundled QEMU missing virtio-vga" }
            if ($LASTEXITCODE -ne 0 -or ($devices -join "`n") -notmatch 'hda-output' -or ($devices -join "`n") -notmatch 'ich9-intel-hda') { throw "Bundled QEMU missing HDA output devices" }
            $env:QEMU_SYSTEM = $qemu
            $env:QEMU_IMG = $img
            $env:QEMU_DATA = "$PWD/package/qemu/share/qemu"
            & ./build/Release/managed_disk_tests.exe
            if ($LASTEXITCODE -ne 0) { throw "Managed disk test failed: $LASTEXITCODE" }
            $output = & python tests/qemu_smoke.py 2>&1
            $code = $LASTEXITCODE
            $output | ForEach-Object { Write-Host $_ }
            if ($code -ne 0) { throw "QEMU smoke failed: $output" }
            $output = & python tests/uefi_smoke.py 2>&1
            $code = $LASTEXITCODE
            $output | ForEach-Object { Write-Host $_ }
            if ($code -ne 0) { throw "UEFI smoke failed: $output" }
            $env:QEMU_TEST_GRAPHICS = 'virtio'
            $output = & python tests/uefi_smoke.py 2>&1
            $code = $LASTEXITCODE
            Remove-Item Env:QEMU_TEST_GRAPHICS
            $output | ForEach-Object { Write-Host $_ }
            if ($code -ne 0) { throw "VirtIO UEFI display smoke failed: $output" }
            $output = & python tests/qmp_smoke.py 2>&1
            $code = $LASTEXITCODE
            $output | ForEach-Object { Write-Host $_ }
            if ($code -ne 0) { throw "QMP input smoke failed: $output" }
            $output = & python tests/sdl_batch_benchmark.py 2>&1
            $code = $LASTEXITCODE
            $output | ForEach-Object { Write-Host $_ }
            if ($code -ne 0) { throw "SDL batching benchmark failed: $output" }
            Write-Output "::notice::$output"
          } catch {
            $text = ($_ | Out-String).Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A')
            Write-Output "::error::$text"
            exit 1
          }
      - name: Fetch isolated previous engine for reference comparison
        if: ${{ inputs.qemu_run_id == '' || inputs.engine_benchmark == true }}
        uses: actions/download-artifact@v4
        with:
          name: QEMU-source-build
          path: baseline-qemu
          run-id: '45580334830'
          github-token: ${{ github.token }}
      - name: Compare real TCG engines without Android FPS claims
        if: ${{ inputs.qemu_run_id == '' || inputs.engine_benchmark == true }}
        shell: pwsh
        run: |
          python tests/tcg_engine_benchmark.py --baseline baseline-qemu --candidate package/qemu
          if ($LASTEXITCODE -ne 0) { throw 'Actual TCG engine comparison failed.' }
      - uses: actions/upload-artifact@v4
        if: ${{ always() && (inputs.qemu_run_id == '' || inputs.engine_benchmark == true) }}
        with:
          name: Nexus-engine-reference-evidence
          path: |
            tcg-engine-results.json
            package/qemu/ENGINE-BUILD.txt
          if-no-files-found: warn
      - name: Package shell
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path package -Force | Out-Null
          Copy-Item build/Release/ProjectNexus.exe package/
          windeployqt --release package/ProjectNexus.exe
          if ($LASTEXITCODE -ne 0) { throw 'Player Qt deployment failed.' }
          Copy-Item README.md package/
          New-Item -ItemType Directory -Path image-studio -Force | Out-Null
          Copy-Item -Recurse package/qemu image-studio/qemu
          Copy-Item scripts/launch.ps1 image-studio/
          Copy-Item scripts/prepare-android.ps1 image-studio/
          Copy-Item scripts/image-studio.ps1 image-studio/
          Copy-Item build/Release/NexusImageStudio.exe image-studio/
          windeployqt --release image-studio/NexusImageStudio.exe
          if ($LASTEXITCODE -ne 0) { throw 'Image Studio Qt deployment failed.' }
          New-Item -ItemType Directory -Path image-studio/offline-files -Force | Out-Null
          Copy-Item image-studio-tools/offline_editor.py,image-studio-tools/image_workspace.py image-studio/offline-files/
          Copy-Item README.md image-studio/
      - name: Create and verify portable ZIP downloads
        run: python packaging/package_release.py package image-studio downloads
      - uses: actions/upload-artifact@v4
        with:
          name: ProjectNexus-Windows
          compression-level: 0
          path: downloads/player/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: ProjectNexus-ImageStudio-Developer
          compression-level: 0
          path: downloads/studio/
          if-no-files-found: error
  offline-files:
    name: Offline image editor (Linux libguestfs)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install image tools
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-guestfs qemu-utils libguestfs-tools
          sudo chmod a+r /boot/vmlinuz*
      - name: Test actual QCOW2 copy and filesystem edits
        env:
          LIBGUESTFS_BACKEND: direct
          LIBGUESTFS_BACKEND_SETTINGS: force_tcg
        run: /usr/bin/python3 tests/image_workspace_test.py
  preview:
    name: Interactive UI preview
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Check interactive preview in Chromium
        run: |
          python3 preview/server.py &
          node tests/preview_test.js
  qemu-smoke:
    name: Real QEMU boot smoke test (Linux TCG)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install QEMU
        run: sudo apt-get update && sudo apt-get install -y qemu-system-x86 qemu-utils
      - name: Boot test sector and create QCOW2 disk
        run: python3 tests/qemu_smoke.py

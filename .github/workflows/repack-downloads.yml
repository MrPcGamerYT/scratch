name: Repack and verify emulator downloads
on:
  push:
    paths:
      - .github/workflows/repack-downloads.yml
  workflow_dispatch:
    inputs:
      guest_run:
        description: Successful guest build run ID
        required: true
      windows_run:
        description: Successful Windows build run ID
        required: true
permissions:
  actions: read
  contents: write
jobs:
  repack:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
      GUEST_RUN: ${{ inputs.guest_run }}
      WINDOWS_RUN: ${{ inputs.windows_run }}
      REPOSITORY: ${{ github.repository }}
      SOURCE_SHA: ${{ github.sha }}
    steps:
      - name: Require actual successful builds on this session branch
        run: |
          python3 - <<'PY'
          import subprocess,json,os
          for key in ['GUEST_RUN','WINDOWS_RUN']:
              run=os.environ[key]
              assert run.isdigit()
              data=json.loads(subprocess.check_output(['gh','api',f'repos/{os.environ["REPOSITORY"]}/actions/runs/{run}']))
              assert data['conclusion']=='success',data['conclusion']
              assert data['head_branch']=='arena/b4ea6e6d-scratch',data['head_branch']
              print(key,run,data['head_sha'])
          PY
      - uses: actions/download-artifact@v4
        with:
          name: Nexus-Android11-FOSS-Candidate
          run-id: ${{ inputs.guest_run }}
          github-token: ${{ github.token }}
          path: guest
      - uses: actions/download-artifact@v4
        with:
          name: ProjectNexus-Windows
          run-id: ${{ inputs.windows_run }}
          github-token: ${{ github.token }}
          path: player
      - name: Verify all guest payload checksums and rebuild ordinary downloadable ZIP
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full unzip
          mkdir -p downloads
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,zipfile
          root=Path('guest')
          for line in (root/'SHA256SUMS.txt').read_text().splitlines():
              expected,name=line.split('  ',1)
              path=(root/name).resolve()
              assert path.is_relative_to(root.resolve())
              h=hashlib.sha256()
              with path.open('rb') as source:
                  for block in iter(lambda:source.read(4194304),b''):h.update(block)
              assert h.hexdigest()==expected,name
          output=Path('downloads/Nexus-Android11-Guest.zip')
          with zipfile.ZipFile(output,'w',zipfile.ZIP_DEFLATED,compresslevel=1,allowZip64=True) as archive:
              for path in sorted(root.rglob('*')):
                  if path.is_file():archive.write(path,path.relative_to(root).as_posix())
          with zipfile.ZipFile(output) as archive:
              assert archive.testzip() is None
              assert 'images/android-base.qcow2' in archive.namelist()
          player=list(Path('player').rglob('*.zip'))
          assert len(player)==1,[str(p) for p in player]
          import shutil
          shutil.copyfile(player[0],'downloads/Nexus-Windows-Player.zip')
          with zipfile.ZipFile('downloads/Nexus-Windows-Player.zip') as archive:
              assert archive.testzip() is None
          PY
          7z t downloads/Nexus-Android11-Guest.zip
          unzip -t downloads/Nexus-Android11-Guest.zip > guest-unzip-test.txt
          7z t downloads/Nexus-Windows-Player.zip
          unzip -t downloads/Nexus-Windows-Player.zip > player-unzip-test.txt
          (cd downloads && sha256sum *.zip > SHA256SUMS.txt)
          cat downloads/SHA256SUMS.txt
          stat -c '%n %s bytes' downloads/*.zip
      - name: Publish verified files as experimental release downloads
        run: |
          set -euo pipefail
          tag="nexus-verified-${GUEST_RUN}-${WINDOWS_RUN}"
          printf 'Experimental matched guest and emulator. Guest build: %s. Windows build: %s. ZIP CRCs tested with Python, 7-Zip and unzip; guest payload SHA256 verified.\n\nUse a new isolated instance. Never overwrite an existing backing disk. Linux guest functional checks and Windows build tests are not hardware acceleration/game compatibility certification.\n' "$GUEST_RUN" "$WINDOWS_RUN" > release-notes.txt
          gh release create "$tag" --repo "$REPOSITORY" --target "$SOURCE_SHA" --prerelease --title "Nexus verified experimental downloads" --notes-file release-notes.txt downloads/*.zip downloads/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: Repacked-Verified-Nexus-Downloads
          path: downloads/
          compression-level: 0
          retention-days: 7

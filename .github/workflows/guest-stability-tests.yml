name: Guest stability diagnostic safeguards
on:
  push:
    paths:
      - 'tests/android_stability.py'
      - 'tests/android_boot_probe.py'
      - 'tests/android_probe_tests.py'
      - '.github/workflows/guest-stability-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  safeguards:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Test missing-evidence, ANR, timeout and non-mutation safeguards
        run: python3 tests/android_probe_tests.py
      - name: Syntax check diagnostic and boot integration
        run: python3 -m py_compile tests/android_stability.py tests/android_boot_probe.py
